{% extends "base.html" %}

{% block content %}

<div class="container">
    
    <div>
        <h2 class="mb-3">タグ作成</h2>
    </div>

    <div class="card mb-4">
        <div class="card-body">

            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="{{ form.name.id_for_label }}">タグ名</label>
                    {{ form.name }}
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-secondary">作成</button>
                    <a href="{% url 'todo_list' %}" class="btn primary ms-2">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</div>



{% endblock content %}
