{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-body">
        <p class="text-center mb-4">ログイン</p>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">ユーザーネーム</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label" for="{{ form.password.id_for_label }}">パスワード</label>
                <div class="input-group">
                    {{ form.password }}
                    <button type="button" class="btn btn-outline-secondary toggle-password"
                    data-target="{{ form.password.id_for_label }}"
                    aria-label="パスワードを表示">

                    <i class="bi bi-eye-slash"></i>

                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100">ログイン</button>
            
            <div class="text-center mt-3">
                <span class="text-body-secondary">アカウントをお持ちでない方は</span>
                <a href="{% url 'signup' %}">サインアップ</a>
            </div>

        </form>
    </div>
</div>
{% endblock content %}
